<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enfoque — D · fotografía de fondo</title>
<style>
  :root {
    --ink: #202124;
    --white: #fff;
    --accent-dark: #ff777b;
    --dim-dark: #c2c2c2;
    --gutter: clamp(1.25rem, 6vw, 6.75rem);
    --sans: 'Avenir Next', Avenir, Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ink);
    color: var(--white);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .slide {
    position: relative;
    min-height: 100svh;
    padding: clamp(5rem, 10vw, 9rem) var(--gutter);
    display: flex;
    align-items: center;
    overflow: hidden;
    background: var(--ink);
  }
  .frame { width: min(100%, 70rem); margin: auto; display: grid; gap: 3rem; position: relative; }
  @media (min-width: 760px) {
    .frame { grid-template-columns: 0.8fr 1.2fr; align-items: center; gap: 5vw; }
  }
  .eyebrow {
    margin: 0 0 1.5rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-dark);
  }
  .title {
    margin: 0;
    font-size: clamp(2.5rem, 7vw, 5.6rem);
    font-weight: 600;
    letter-spacing: -0.075em;
    line-height: 1.03;
    max-width: 13ch;
  }
  .copy {
    margin: 0;
    max-width: 26ch;
    font-size: clamp(1.8rem, 5vw, 4.2rem);
    font-weight: 500;
    letter-spacing: -0.04em;
    line-height: 1.25;
  }
  .index {
    position: absolute;
    right: var(--gutter);
    bottom: 1.5rem;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--dim-dark);
  }
  .logo {
    position: absolute;
    z-index: 2;
    top: 1rem;
    right: var(--gutter);
    padding: 0.375rem 0.5rem;
    background: var(--white);
    line-height: 0;
  }
  .logo img { display: block; width: clamp(9rem, 11vw, 10rem); height: auto; }

  /* The added element: the meeting photograph, scrimmed down to a texture. */
  .backdrop {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .backdrop img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 62% 52%;
    filter: grayscale(1) contrast(1.04) brightness(0.92);
  }
  .backdrop::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgb(32 33 36 / 58%) 0%, rgb(32 33 36 / 34%) 34%, rgb(32 33 36 / 74%) 100%),
      linear-gradient(96deg, rgb(32 33 36 / 88%) 0%, rgb(32 33 36 / 72%) 46%, rgb(32 33 36 / 62%) 100%);
  }

  .rise { opacity: 0; transform: translateY(14px); animation: rise 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.1s forwards; }
  .rise-late { opacity: 0; transform: translateY(14px); animation: rise 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.35s forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .rise, .rise-late { opacity: 1; transform: none; animation: none; }
  }
</style>
